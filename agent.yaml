permissions:
  shell:
    default: ask
    read_only: allow
    timeout_seconds: 30
  filesystem:
    read: allow
    write: ask
    delete: ask
  network:
    default: ask
  high_privilege: ask
  credential_access: deny
memory:
  auto_write: true
  require_review_for_user_preferences: true
  block_secrets: true
security:
  redact_logs: true
  redact_memory: true
  redact_model_calls: true
  redact_network: true
  unknown_risk: high
models:
  provider: openai
  default: gpt-5.4-mini
  planner: gpt-5.4-mini
  reflector: gpt-5.4-mini
  allow_task_override: true
  remote_calls_enabled: false
  approval_required: true
  api_key_env_var: OPENAI_API_KEY
